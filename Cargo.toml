[package]
name = "github-explorer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2.130"
dotenvy = "0.15.7"
